name: MLOps Pipeline

on:
  push:
    branches: [cicd]
  workflow_dispatch:

throughout the workflow if we want any env variables to define we weill put only in this session
env:
  AWS_REGION: us-east-1
  S3_BUCKET: churn-model-bucket-cicd-abhi

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push commits
permission write ichamu ante github actions ki manam left side lo unna files annitlo github actions ki write permission ichinatte
general ga mana read permission ea istam by default emi ivvakapothe read annatu but ikkada delibarate ga write ichamu ee job ki
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}  # Use built-in token
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Generate dataset
      run: python generate_data.py
    
    - name: Train model
      run: python train.py
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
      ee screts repo settings ki valthe screts and variables and vastadi akkada actions slect chaskoni repository secrets ki valli
      create chaskoni scret name = AWS_ACCESS_KEY_ID , scret = awskeyid lo vachina key id and new secret add chaskoni
      scret name = AWS_SECRET_ACCESS_KEY , scret = awsscretaccesskey ivvali appudu run ayinappudu akkadanunchi tiskuntadii
      built in scret storage undi actions ki 
      same variables ki kuda chaskovachu
    
    - name: Push model to S3 directly
      run: |
        aws s3 cp models/churn_model.pkl s3://churn-model-bucket-cicd-abhi/models/churn_model.pkl
        echo "Model pushed to S3 is success"
    
    - name: Update inference.yaml with S3 model path
      run: |
        MODEL_URI="s3://churn-model-bucket-cicd-abhi/models/churn_model.pkl"
        sed -i "s|storageUri: .*|storageUri: $MODEL_URI|g" k8s/inference.yaml
    ikkada manam inference.yaml lo storage uri lo s3 bucket address ni replace chastunnamu already unna stoage uri ni
    (storageUri: s3://churn-model-bucket-cicd-abhi/models/churn_model.pkl) push to s3 directory step lo unna 
    s3 bucket address s3://churn-model-bucket-cicd-abhi/models/churn_model.pkl  tho replace chasthundi
    
    - name: Commit updated inference.yaml
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add k8s/inference.yaml
        git commit -m "Update model S3 path [skip ci]" || echo "No changes"
        git push || echo "No changes to push"
