name: MLOps Pipeline with DVC

on:
  push:
    branches: [cicd]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  S3_BUCKET: churn-model-bucket-cicd-abhi

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install dvc[s3]   # NEW: install DVC with S3 support

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Generate dataset
      run: python generate_data.py

    - name: Train model
      run: python train.py   # Data scientist saves model locally in models/churn_model.pkl

    # -------------------------------
    # OLD (your pipeline):
    #   aws s3 cp models/churn_model.pkl s3://bucket/models/churn_model.pkl
    #   → overwrites the same file each run
    #
    # NEW (DVC pipeline):
    #   dvc add + dvc push
    #   → creates a new hash each run, stores multiple versions in S3
    # -------------------------------

    - name: Track model with DVC
      run: |
        dvc add models/churn_model.pkl
        git add models/churn_model.pkl.dvc .gitignore
        git commit -m "Track new model with DVC" || echo "No changes"

    - name: Push model to S3 via DVC
      run: |
        dvc remote add origin s3://${S3_BUCKET}/dvcstore
        dvc push   # NEW: uploads model under hash-based folder, keeps old versions

    - name: Update inference.yaml with DVC path
      run: |
        # In practice you’d extract the hash from the .dvc file
        MODEL_URI="s3://${S3_BUCKET}/dvcstore/<hash>/churn_model.pkl"
        sed -i "s|storageUri: .*|storageUri: $MODEL_URI|g" k8s/inference.yaml

    - name: Commit updated inference.yaml
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add k8s/inference.yaml
        git commit -m "Update inference.yaml with DVC model path [skip ci]" || echo "No changes"
        git push || echo "No changes to push"

    # ----------------------------------------------------------
    # 📂 BUCKET VISUALIZATION
    #
    # OLD (aws s3 cp approach):
    # s3://churn-model-bucket-cicd-abhi/
    # └── models/
    #     └── churn_model.pkl   <-- overwritten every run
    #
    # NEW (DVC approach):
    # s3://churn-model-bucket-cicd-abhi/dvcstore/
    # └── ab/1234.../churn_model.pkl   <-- version 1
    # └── cd/5678.../churn_model.pkl   <-- version 2
    # └── ef/9012.../churn_model.pkl   <-- version 3
    #
    # Difference:
    # - aws s3 cp → only one file, no history
    # - DVC → multiple versions stored under hash-based folders, linked to Git commits
    # ----------------------------------------------------------
